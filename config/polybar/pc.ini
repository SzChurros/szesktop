[bar/topbar]
font-0 = "JetBrains Mono NL:size=10"
width = 100%
height = 24
background = #222
foreground = #fff
modules-left = space menu space i3
modules-right = tray space date

[module/space]
type = custom/text
content = "  "

[module/menu]
type = custom/text

content = "#"
content-padding = 0

; the same menu from i3/config
click-left = ~/rofi-scripts/rofimenu

[module/i3]
type = internal/i3
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-scroll = false

label-focused = %index%
label-focused-background = #444
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2

label-visible = %index%
label-visible-padding = 2

label-urgent = %index%!
label-urgent-background = #ff0000
label-urgent-padding = 2

[module/date]
type = internal/date
date = %d-%m-%Y
time = %H:%M
label = %date% %time%

[module/tray]
type = internal/tray
tray-padding = 2
tray-maxsize = 16
tray-position = right

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC
full-at = 98

label-charging = "%percentage%%"
label-discharging = "%percentage%%"
label-full = "full"
